<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chủ đề 2: Tôi trưởng thành</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8f1;--text:#1f2a44;--muted:#5b6478;--accent:#f26b3a;--a2:#0ea5a4;--green:#5aa845;--blue:#2563eb;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:#efe9dc;overflow:hidden;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--text)}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--bg);box-shadow:0 20px 80px rgba(0,0,0,.15)}
.slide{position:absolute;inset:0;display:none;overflow:hidden}
.slide.active,.slide.entering,.slide.leaving{display:block}
.bg{position:absolute;inset:0;background:radial-gradient(55% 55% at 8% 8%,rgba(242,107,58,.16),transparent),radial-gradient(50% 50% at 95% 92%,rgba(90,168,69,.2),transparent),radial-gradient(40% 40% at 90% 10%,rgba(14,165,164,.12),transparent),var(--bg)}
.wm{position:absolute;right:-90px;bottom:-110px;width:760px;height:760px;opacity:.06;z-index:0;pointer-events:none;animation:drift 30s ease-in-out infinite;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path fill='%231f2a44' d='M50 95C50 60 30 45 8 42c0 28 18 48 42 53zM52 70c0-30 18-50 42-58 2 30-14 52-42 58z'/></svg>") no-repeat center/contain}
@keyframes drift{50%{transform:translate(-24px,-18px) rotate(3deg)}}
.c{position:absolute;inset:0;padding:64px 96px;z-index:1}
.hd{display:flex;align-items:center;gap:32px;height:130px}
.bd{display:flex;align-items:center;gap:0;background:linear-gradient(135deg,var(--c,#f26b3a),#f9a03f);color:#fff;border-radius:60px 14px 14px 60px;padding:6px 26px 6px 6px;font-weight:800;font-size:26px;box-shadow:0 10px 24px rgba(242,107,58,.3);flex:none}
.bd b{width:62px;height:62px;border-radius:50%;background:#fff;color:var(--c,#f26b3a);display:grid;place-items:center;font-size:36px;margin-right:16px}
h2{font-size:56px;line-height:1.15;margin:0;flex:1;color:var(--text);font-weight:800}
.ico{width:130px;height:130px;border-radius:32px;background:#fff;box-shadow:0 16px 40px rgba(31,42,68,.14);display:grid;place-items:center;flex:none;color:var(--c,#f26b3a)}
.ico svg{width:84px;height:84px;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.body{position:absolute;left:96px;right:96px;top:230px;bottom:70px;display:flex;gap:36px}
.col{flex:1;display:flex;flex-direction:column;gap:26px;min-width:0}
.card{background:var(--card);border-radius:24px;box-shadow:0 18px 44px rgba(31,42,68,.1);padding:28px 34px;border-top:8px solid var(--c)}
.card h3{margin:0 0 12px;font-size:36px;color:var(--c)}
ul{margin:0;padding:0;list-style:none}
li{font-size:30px;line-height:1.35;padding-left:34px;position:relative;margin:8px 0}
li:before{content:"";position:absolute;left:4px;top:.55em;width:14px;height:14px;border-radius:50%;background:var(--c,#f26b3a)}
.sit{position:relative;background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:22px;padding:58px 34px 26px;box-shadow:0 14px 34px rgba(31,42,68,.1)}
.sit i{position:absolute;left:0;top:0;background:var(--c);color:#fff;font-style:normal;font-weight:800;font-size:26px;padding:8px 28px;border-radius:22px 0 22px 0}
.sit p{margin:0;font-size:27px;line-height:1.4}
.sit p em{display:block;margin-top:10px;font-weight:600;color:var(--c)}
.chip{background:#fff;border-radius:18px;padding:16px 26px;font-size:29px;line-height:1.3;box-shadow:0 8px 22px rgba(31,42,68,.09);border-left:8px solid var(--c);flex:1}
.row{display:flex;gap:22px}.wrap{flex-wrap:wrap}
.ask{font-size:32px;font-weight:600;margin:0;color:var(--text)}
.ask b{color:var(--accent)}
.vs{align-self:center;flex:none;width:92px;height:92px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:36px;display:grid;place-items:center;box-shadow:0 10px 26px rgba(242,107,58,.4)}
.num{counter-reset:n}.num .chip{counter-increment:n;position:relative;padding-left:96px;display:flex;align-items:center}
.num .chip:before{content:counter(n);position:absolute;left:20px;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:28px;display:grid;place-items:center}
.tl{display:flex;gap:26px;position:relative}
.step{flex:1;background:#fff;border-radius:24px;padding:60px 26px 26px;box-shadow:0 18px 44px rgba(31,42,68,.1);position:relative;font-size:29px;line-height:1.35}
.step b{position:absolute;left:26px;top:-26px;width:64px;height:64px;border-radius:50%;background:var(--c);color:#fff;font-size:34px;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.step h4{margin:0 0 8px;font-size:32px;color:var(--c)}
table{border-collapse:separate;border-spacing:0;width:100%;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 14px 34px rgba(31,42,68,.1)}
th{background:var(--accent);color:#fff;font-size:30px;padding:14px}
td{font-size:27px;padding:14px 22px;vertical-align:top;line-height:1.35}
td:first-child{font-weight:800;width:240px;background:#fff4ec;color:var(--accent)}
.chk{cursor:pointer;display:flex;align-items:center;gap:20px;transition:transform .2s}
.chk:hover{transform:translateX(6px)}
.chk:before{content:"✓";flex:none;width:46px;height:46px;border-radius:12px;border:3px solid var(--c);display:grid;place-items:center;color:transparent;font-size:30px;font-weight:800;transition:.25s}
.chk.on:before{background:var(--c);color:#fff}
.cover .bg{background:radial-gradient(60% 70% at 85% 50%,rgba(14,165,164,.22),transparent),radial-gradient(50% 50% at 10% 90%,rgba(90,168,69,.25),transparent),radial-gradient(50% 50% at 15% 10%,rgba(242,107,58,.2),transparent),#fff9ee}
.cv{position:absolute;inset:0;display:flex;align-items:center;padding:0 110px;gap:70px}
.cv .tx{flex:1}
.tag{display:inline-block;background:linear-gradient(135deg,#f26b3a,#f9a03f);color:#fff;font-weight:800;font-size:34px;padding:10px 36px;border-radius:14px 50px 50px 14px;box-shadow:0 12px 26px rgba(242,107,58,.35)}
.big{font-size:118px;line-height:1.02;font-weight:800;margin:26px 0 30px;color:var(--text)}
.big span{color:var(--accent)}
.goal{background:#fff;border-radius:24px;padding:20px 34px;box-shadow:0 18px 44px rgba(31,42,68,.1);border-left:10px solid var(--green)}
.goal h3{margin:0;font-size:32px;color:var(--green)}
.art{width:760px;height:760px;flex:none;filter:drop-shadow(0 24px 50px rgba(31,42,68,.2))}
.art svg{width:100%;height:100%;animation:float 6s ease-in-out infinite}
.thx{font-size:150px}
.big.thx{font-size:150px}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:0;background:rgba(31,42,68,.14);color:#1f2a44;font-size:30px;cursor:pointer;backdrop-filter:blur(6px);transition:opacity .3s,background .2s;z-index:50}
.nav:hover{background:rgba(31,42,68,.28)}.nav:disabled{opacity:.25;cursor:default}
.nav:focus-visible,.fs:focus-visible{outline:3px solid var(--accent)}
.prev{left:20px}.next{right:20px}
.hud{position:fixed;right:24px;bottom:18px;font-size:16px;font-weight:600;color:#1f2a44;background:rgba(255,255,255,.7);padding:4px 14px;border-radius:20px;transition:opacity .3s;z-index:50}
.fs{position:fixed;right:20px;top:calc(14px + env(safe-area-inset-top,0px));width:44px;height:44px;border-radius:12px;border:0;background:rgba(31,42,68,.14);color:#1f2a44;font-size:22px;cursor:pointer;z-index:50;transition:opacity .3s}
.progress{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(31,42,68,.1);z-index:50}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .4s ease}
body.idle .nav,body.idle .hud,body.idle .fs{opacity:0}
[data-anim]{opacity:0}
[data-step]{opacity:0;}
[data-step].in{opacity:1;animation-duration:var(--dur,.5s);animation-delay:var(--delay,0s);animation-timing-function:cubic-bezier(.22,.8,.3,1);animation-fill-mode:both;animation-name:aUp;}
[data-anim=stagger]{opacity:1}
.f1{flex:1 1 0;min-width:0}.sit.f1 p{font-size:32px}.sit.f1 .ans{font-size:29px;padding:14px 20px}.sit.f1 i{font-size:28px}.body>.card{flex:1;min-width:0;align-self:flex-start}.body>.sit{min-width:0}.ans{margin-top:14px;background:#fff;border-radius:14px;padding:12px 18px;font-size:25px;line-height:1.35;border-left:6px solid var(--c)}
.in[data-anim]{opacity:1;animation-duration:var(--dur,.7s);animation-delay:var(--delay,0s);animation-timing-function:cubic-bezier(.22,.8,.3,1);animation-fill-mode:both}
.in[data-anim=fade-up]{animation-name:aUp}.in[data-anim=fade-right]{animation-name:aRight}.in[data-anim=zoom-in]{animation-name:aZoom}.in[data-anim=pop]{animation-name:aPop}.in[data-anim=stagger]{animation:none}
@keyframes aUp{from{opacity:0;transform:translateY(40px)}}
@keyframes aRight{from{opacity:0;transform:translateX(-60px)}}
@keyframes aZoom{from{opacity:0;transform:scale(.85)}}
@keyframes aPop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.t-fade.entering{animation:fI .5s both}.t-fade.leaving{animation:fO .5s both}
.dir-next .t-slide.entering{animation:inR .6s cubic-bezier(.22,.8,.3,1) both}.dir-next .t-slide.leaving{animation:outL .6s cubic-bezier(.22,.8,.3,1) both}
.dir-prev .t-slide.entering{animation:inL .6s cubic-bezier(.22,.8,.3,1) both}.dir-prev .t-slide.leaving{animation:outR .6s cubic-bezier(.22,.8,.3,1) both}
.t-zoom.entering{animation:zI .6s cubic-bezier(.22,.8,.3,1) both}.t-zoom.leaving{animation:zO .6s both}
.t-rise.entering{animation:rI .6s cubic-bezier(.22,.8,.3,1) both}.t-rise.leaving{animation:fO .5s both}
@keyframes fI{from{opacity:0}}@keyframes fO{to{opacity:0}}
@keyframes inR{from{transform:translateX(8%);opacity:0}}@keyframes outL{to{transform:translateX(-8%);opacity:0}}
@keyframes inL{from{transform:translateX(-8%);opacity:0}}@keyframes outR{to{transform:translateX(8%);opacity:0}}
@keyframes zI{from{transform:scale(.92);opacity:0}}@keyframes zO{to{transform:scale(1.06);opacity:0}}
@keyframes rI{from{transform:translateY(8%);opacity:0}}
@media (prefers-reduced-motion:reduce){[data-anim]{opacity:1!important;animation:none!important}[data-step]{opacity:1!important}.slide,.wm,.ico svg,.art svg{animation:none!important}}

.body{left:72px;right:72px;top:210px;bottom:36px;gap:28px}
.col{gap:20px}

.card>ul{flex:1;display:flex;flex-direction:column;justify-content:space-evenly}

.sit i{font-size:29px;padding:9px 28px}

.sit.f1 p{font-size:34px}
.sit.f1 i{font-size:29px}

.sit.f1 .ans{font-size:31px;padding:16px 20px}

.ask{font-size:36px;line-height:1.3}
.vs{width:88px;height:88px;font-size:38px}
.tl{gap:22px}
.step{padding:66px 28px 30px;font-size:32px;line-height:1.38;display:flex;flex-direction:column;justify-content:center}

.step h4{font-size:36px;line-height:1.2}
table th{font-size:34px;padding:18px}

td:first-child{width:260px}
.body>.card{align-self:stretch;min-height:0}
.body>.sit{min-width:0;flex:1 1 0}
.col>.card,.col>.sit{flex:1 1 auto;min-height:0}
.cv{padding:0 84px;gap:48px}
.tag{font-size:38px;padding:12px 36px}
.big{font-size:132px;line-height:1.02;margin:22px 0 26px}
.goal{padding:24px 32px}
.goal h3{font-size:36px}
.art{width:680px;height:680px}
.thx{font-size:150px}
.hud{font-size:19px;padding:6px 16px}
.fs{width:48px;height:48px;font-size:24px}
.nav{width:60px;height:60px;font-size:34px}

/* Cards and columns now use the available slide height rather than bunching at the top. */
.body>.col{min-height:0}
@media (max-width:1500px){
  .nav.prev{left:12px}.nav.next{right:12px}
}
@media (prefers-reduced-motion:reduce){[data-anim]{opacity:1!important;animation:none!important}[data-step]{opacity:1!important}.slide,.wm,.ico svg,.art svg{animation:none!important}}

</style>

const C=(t,a,c,d=300,startStep=0)=>{

{h:H(9,'Liệt kê thay đổi và cách thích ứng','list',T)+`<div class="body" style="flex-direction:column;gap:30px"><p class="ask" data-anim="fade-up" data-delay="300">${ic('pencil')} Em đang và sẽ có những thay đổi nào? Cần làm gì để thích ứng? <b>Ví dụ:</b></p><div data-anim="fade-up" data-delay="500"><table><tr><th>Thay đổi</th><th>Những việc cần làm để thích ứng</th></tr><tr><td>Sống xa gia đình</td><td>Tập nấu các món ăn đơn giản, đủ dinh dưỡng · Biết chăm sóc bản thân, dùng thuốc đúng khi ốm · Tập thể dục nâng cao sức khoẻ · Lập kế hoạch chi tiêu phù hợp · Biết sử dụng tài khoản ngân hàng</td></tr><tr><td>Lên đại học</td><td>Tìm hiểu trước chương trình, cách học và môi trường mới · Chủ động kết bạn, tham gia câu lạc bộ · Tự lập kế hoạch học tập</td></tr></table></div></div>`},

/*23 HĐ10*/
{h:H(10,'Lập và thực hiện kế hoạch rèn luyện bản thân','list',O)+`<div class="body" style="flex-direction:column;gap:20px"><p class="ask" data-anim="fade-up" data-delay="250" style="text-align:center">Rèn luyện: <b>ý chí · đam mê · tư duy độc lập · khả năng thích ứng</b></p><div class="tl" style="margin-top:40px;flex:1"><div class="step" style="--c:${O}" data-anim="fade-up" data-delay="350"><b>1</b><h4>Lập kế hoạch</h4>Xác định mục tiêu ngắn hạn, dài hạn và sắp xếp ưu tiên · Liệt kê vấn đề cần ưu tiên · Dự kiến kết quả theo từng khoảng thời gian.</div><div class="step" style="--c:${G}" data-anim="fade-up" data-delay="500"><b>2</b><h4>Thực hiện</h4>Thực hiện kế hoạch rèn luyện của bản thân.</div><div class="step" style="--c:${U}" data-anim="fade-up" data-delay="650"><b>3</b><h4>Ghi chép</h4>Theo dõi quá trình thực hiện và sự thay đổi của bản thân theo thời gian.</div><div class="step" style="--c:${V}" data-anim="fade-up" data-delay="800"><b>4</b><h4>Phân tích, báo cáo</h4>Đánh giá điểm mạnh, tồn tại · Tìm nguyên nhân chưa thành công · Điều chỉnh kế hoạch và tiếp tục.</div></div></div>`},

/*24 Đánh giá*/
{h:H('✓','Đánh giá cuối chủ đề','medal',O)+B(`<div class="col" data-anim="stagger" data-child="fade-right" data-stagger="90" data-delay="300">${P(['Nêu được biểu hiện, việc làm thể hiện sự trưởng thành','Trình bày được biểu hiện phẩm chất ý chí và đam mê','Chỉ ra được đặc điểm người có tư duy độc lập','Kể được hành động thể hiện khả năng thích ứng'],O).replace(/class="chip"/g,'class="chip chk" onclick="this.classList.toggle(\'on\')"')}</div><div class="col" data-anim="stagger" data-child="fade-right" data-stagger="90" data-delay="450">${P(['Giới thiệu được đam mê và quá trình thực hiện','Thể hiện được việc làm chứng tỏ trưởng thành','Thể hiện được ý chí và tư duy độc lập','Thực hiện kế hoạch rèn luyện và nhận xét kết quả'],G).replace(/class="chip"/g,'class="chip chk" onclick="this.classList.toggle(\'on\')"')}<div class="chip" style="--c:${V};flex:none;font-weight:800;text-align:center" data-anim="pop" data-delay="1000">Mức độ em đạt được: Đạt / Chưa đạt</div></div>`)},

/*25 Cảm ơn*/
{cover:1,h:`<div class="cv" style="justify-content:center;text-align:center;flex-direction:column;gap:10px"><div class="art" style="width:200px;height:200px;color:${R}" data-anim="pop">${I('heart',200)}</div><div class="big thx" data-anim="fade-up" data-delay="200">CẢM <span>ƠN</span></div><div class="goal" style="border-color:${O}" data-anim="fade-up" data-delay="400"><h3 style="color:${O};font-size:44px">Cảm ơn các bạn đã lắng nghe!</h3><p style="font-size:32px;margin:10px 0 0;color:var(--muted)">Mỗi ngày một bước, cùng trưởng thành</p></div></div>`}
];

const stage=document.getElementById('stage'),T4=['fade','slide','zoom','rise'];
stage.innerHTML=sl.map((s,i)=>`<section class="slide t-${T4[i%4]}${s.cover?' cover':''}"><div class="bg"></div><div class="wm"></div><div class="c">${s.h}</div></section>`).join('');
const els=[...stage.children],N=els.length;let cur=0,busy=false,currentStep=0;
const $=id=>document.getElementById(id);

function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

function play(sec){
 sec.querySelectorAll('[data-anim=stagger]').forEach(p=>{[...p.children].forEach((c,i)=>{c.dataset.anim=p.dataset.child||'fade-up';c.dataset.delay=(+(p.dataset.delay||0))+i*(+(p.dataset.stagger||100))})});
 sec.querySelectorAll('[data-anim]:not([data-anim=stagger])').forEach(el=>{el.style.setProperty('--delay',(el.dataset.delay||0)+'ms');el.style.setProperty('--dur',(el.dataset.duration||700)+'ms');el.classList.remove('in');void el.offsetWidth;el.classList.add('in')});
}

function revealSteps() {
  els[cur].querySelectorAll('[data-step]').forEach(el => {
    if (+el.dataset.step <= currentStep) {
      if (!el.classList.contains('in')) {
        el.style.setProperty('--delay', '0ms');
        el.style.setProperty('--dur', '500ms');
        el.classList.add('in');
      }
    } else {
      el.classList.remove('in');
    }
  });
}

function ui(){
  $('ct').textContent=(cur+1)+' / '+N;
  $('bar').style.width=((cur+1)/N*100)+'%';
  $('pv').disabled=cur===0&&currentStep===0;
  $('nx').disabled=cur===N-1;
  try{history.replaceState(null,'','#'+(cur+1))}catch(e){}
}

function go(n,first){
 if(busy||n<0||n>=N||(n===cur&&!first))return;
 const dir=n>=cur?'next':'prev',old=els[cur],nw=els[n];
 if(first){nw.classList.add('active');cur=n;currentStep=0;play(nw);revealSteps();ui();return}
 busy=true;stage.className='stage dir-'+dir;
 old.classList.remove('active');old.classList.add('leaving');nw.classList.add('active','entering');cur=n;currentStep=0;play(nw);revealSteps();ui();
 setTimeout(()=>{old.classList.remove('leaving');nw.classList.remove('entering');busy=false},620);
}

function next() {
  const stepEls = [...els[cur].querySelectorAll('[data-step]')];
  const maxStep = Math.max(...stepEls.map(e => +e.dataset.step), 0);
  if (currentStep < maxStep) {
    currentStep++;
    revealSteps();
    ui();
  } else {
    go(cur + 1);
  }
}

function prev() {
  if (currentStep > 0) {
    currentStep--;
    revealSteps();
    ui();
  } else {
    go(cur - 1);
  }
}

$('pv').onclick=prev;$('nx').onclick=next;
$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
addEventListener('keydown',e=>{
 if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();next()}
 else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prev()}
 else if(e.key==='Home')go(0);else if(e.key==='End')go(N-1);else if(e.key==='f'||e.key==='F')$('fs').onclick();
});
let sx=null;addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50){if(d<0)next();else prev()}sx=null});
let idle;function wake(){document.body.classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>document.body.classList.add('idle'),2500)}
['mousemove','touchstart','keydown'].forEach(ev=>addEventListener(ev,wake));wake();
const h=parseInt((location.hash||'').slice(1));go(h>=1&&h<=N?h-1:0,true);
addEventListener('hashchange',()=>{const k=parseInt(location.hash.slice(1));if(k>=1&&k<=N&&k-1!==cur)go(k-1)});
</script>
